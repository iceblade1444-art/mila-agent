name: mila
description: "MILA - AI Voice Assistant. Real-time voice and text intelligence via Gemini."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Typography
  google_fonts: ^6.2.1

  # Voice pipeline (Gemini Live API)
  web_socket_channel: ^3.0.1
  record: ^6.0.0
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Integrations
  url_launcher: ^6.3.1
  add_2_calendar: 3.0.1

  # Utils
  uuid: ^4.5.1
  intl: '>=0.19.0 <0.30.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
