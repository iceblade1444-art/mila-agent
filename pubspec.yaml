name: mila
description: "MILA - AI Voice Assistant. Real-time voice and text intelligence via Gemini."
publish_to: 'none'

# The +N is the Android versionCode, and it is what the in-app updater compares:
# the phone asks /v1/app/update and the server answers latestCode > currentCode.
# A release that ships without bumping this line is invisible to every installed
# app — CI happily built five "new" APKs that all carried +28, and phones
# correctly reported "already up to date". Bump BOTH halves for a release, then
# register it on the backend so the phones are told it exists.
version: 1.9.0+36

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Typography
  google_fonts: ^6.2.1

  # Voice pipeline (Gemini Live API)
  web_socket_channel: ^3.0.1
  livekit_client: ^2.8.1
  record: ^6.0.0
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.2
  connectivity_plus: ^7.0.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Integrations
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  add_2_calendar: 3.0.1

  # Utils
  uuid: ^4.5.1
  intl: '>=0.19.0 <0.30.0'
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  camera: ^0.12.0+1
  mime: ^2.0.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/soul.md
