# The APK build kept dying at "Gradle task assembleRelease failed with exit code
# 143" — SIGTERM, the kernel killing the daemon, not a compile error and not a
# cancelled workflow. It was intermittent in the way an out-of-memory kill is:
# the same commit built fine in 750s and was killed at 904s.
#
# -Xmx8G with a 4G metaspace on top is more than a GitHub-hosted runner can give
# once the Kotlin compile daemon (its own JVM), D8 and the Dart snapshot are also
# resident. A heap ceiling is a licence to grow, not a reservation, so the JVM
# would climb toward 8G before collecting and get killed on the way. 4G builds
# this project with room to spare; keep it that way rather than raising it when a
# build fails, because raising it is what caused this.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin daemon is a second JVM and inherits nothing from the line above.
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
