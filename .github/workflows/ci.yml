name: MILA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix backend
      - run: npm test --prefix backend

  voice-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests stub livekit and google plugins, so no install step is needed.
      - run: python -m unittest discover -s voice-agent -p "test_*.py" -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter test
      - run: flutter build apk --release --dart-define=MILA_BACKEND_URL=https://agent.milanapremium.uz/mila
      - uses: actions/upload-artifact@v4
        with:
          name: mila-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          # Every push to main builds a 45 MB APK; with the default 90-day
          # retention they piled up to 2.1 GB and uploads started failing on
          # the storage quota (2026-08-10). A week is plenty: anything older
          # is rebuildable from the tag or commit.
          retention-days: 7
