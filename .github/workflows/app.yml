name: MILA app

# The APK build is the expensive job (~14 minutes), so it only runs when
# something that ends up inside the app actually changed.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  # Fast, and deliberately not a dependency of the build below: a missing
  # version bump and a compile error are different problems, and finding one
  # should not hide the other. This answers in seconds; the APK takes fourteen
  # minutes.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares two refs, which the default shallow clone of a
          # single commit cannot do.
          fetch-depth: 0
      - name: A change that ships into the app must move the version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fetched by name rather than assumed: on a pull_request the
            # checkout is the merge ref, and whether it leaves a usable
            # origin/<base> behind is an implementation detail of the action.
            git fetch -q origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # All-zeros on a branch's first push, and a force-push can name a
            # sha that is no longer reachable. Either way the previous commit
            # is the honest comparison.
            case "$base" in
              0000000000000000000000000000000000000000|"") base="HEAD~1" ;;
              *) git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD~1" ;;
            esac
          fi
          bash scripts/check-version-bump.sh "$base"

  flutter:
    runs-on: ubuntu-latest
    # Needed to publish the build to the rolling release below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not "stable". Stable floats, so a Flutter release could break
          # this build with no commit of ours behind it — which is what happened
          # on 3.47.0: the SDK got stricter about nullability and livekit_client
          # 2.8.1 stopped compiling, taking the APK with it. Bump this line
          # deliberately and watch the build, rather than finding out on the day
          # a release is needed.
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter test
      - name: Build the pull request APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --dart-define=MILA_BACKEND_URL=https://agent.milanapremium.uz/mila
      - name: Restore the production signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mila-release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=mila-release.jks\n'
          } > android/key.properties
      - name: Build the signed production APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --dart-define=MILA_BACKEND_URL=https://agent.milanapremium.uz/mila

      # The APK used to be an Actions artifact. On a private repo those consume
      # the paid storage quota: 45 MB per push filled 2.1 GB and every upload
      # started failing, marking green builds red. Release assets do not count
      # against that quota, and the download URL stays the same instead of
      # expiring, so the phone can always be pointed at one link.
      - name: Publish the APK to the rolling latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk mila-android.apk
          notes="Automatic build of \`${GITHUB_SHA::7}\` from main, $(date -u '+%Y-%m-%d %H:%M UTC').

          Install \`mila-android.apk\` below. This release is replaced by every
          push to main, so the link always points at the newest build."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "MILA — latest build" \
              --notes "$notes" \
              --prerelease \
              --target main
          else
            gh release edit latest --notes "$notes"
          fi
          gh release upload latest mila-android.apk --clobber
